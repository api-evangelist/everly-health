- aid: everly-health:pwnhealth-platform
  name: Everly Health Solutions (PWNHealth) Platform API
  description: 'The enterprise lab-connectivity and clinician-oversight API of Everly
    Health Solutions, the former PWNHealth business Everlywell acquired in 2021. It is a
    real, live API: https://api.pwnhealth.com is an AWS API Gateway origin behind
    CloudFront, GET /ping returns HTTP 200 "healthy" anonymously, and a staging twin
    answers at api-staging.pwnhealth.com. Every other path returns HTTP 403
    {"message":"Missing Authentication Token"}. Its reference is a ReadMe-hosted developer
    hub titled "PWNHealth APIs" at https://docs.pwnhealth.com/, which 302s every path to
    /password?redirect=... — a site-wide password wall in place since at least 2019-08-03
    per the Wayback Machine. Ownership is established by pwnhealth.com 301ing to
    www.everlywell.com/enterprise/labs/. No OpenAPI, no SDK and no published rate limits or
    pricing are reachable anonymously; everything recorded here was observed from live
    probes on 2026-08-15, and nothing about the contract itself is asserted because
    nothing about it could be read.'
  humanURL: https://docs.pwnhealth.com/
  baseURL: https://api.pwnhealth.com
