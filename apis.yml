aid: everly-health
name: Everly Health
description: 'Everly Health (legal name Everly Well, Inc.) is an Austin, Texas digital
  health company that operates the Everlywell consumer brand for at-home lab collection
  and testing, Everly Health Solutions (the former PWNHealth / Home Access Health businesses)
  for enterprise lab connectivity, clinician-network oversight and results delivery,
  and the Natalist fertility and pregnancy brand. Its catalog spans daily health, digestive,
  sexual, hormone and cancer-screening panels, paired with an affiliated telehealth
  provider network and the Eva AI platform for member engagement, care coordination
  and support. Everly Health publishes no public developer portal, API reference, SDKs
  or OpenAPI; the only machine-readable contract it serves anonymously is the OAuth
  2.0 / OpenID Connect discovery surface behind its member login host.'
